name: Android Local Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # v1.0.0, v1.1.0 등 버전 태그 푸시 시 트리거
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 생성을 위한 권한

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠 Generate Native Code (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📤 Upload APK as Artifact (상시 백업)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 🎉 Create GitHub Release (태그 푸시 시에만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
